<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raghav & Tara Wedding Invitation</title>
 
<style>
*{margin:0;padding:0;box-sizing:border-box}
 
body{
background:#f9e8e8;
font-family:Georgia,serif;
color:#5a3d3d;
text-align:center;
}
 
.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url('photo.jpg');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
color:white;
padding:20px;
}
 
.hero-box{
background:rgba(255,255,255,.1);
backdrop-filter:blur(5px);
padding:30px;
border-radius:20px;
}
 
.names{
font-size:65px;
color:#ffd98e;
margin:15px 0;
}
 
.section{
padding:60px 20px;
}
 
.card{
background:white;
max-width:850px;
margin:auto;
padding:30px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}
 
.photo{
width:100%;
max-width:400px;
border-radius:20px;
border:6px solid #c9a86a;
}
 
.countdown{
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}
 
.box{
background:#c9a86a;
color:white;
padding:15px;
border-radius:15px;
width:90px;
}
 
.box span{
font-size:28px;
font-weight:bold;
display:block;
}
 
.btn{
display:inline-block;
background:#d63031;
color:white;
padding:14px 24px;
border-radius:30px;
text-decoration:none;
margin-top:20px;
}
 
.info-grid{
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
margin-top:20px;
}
 
.info{
background:white;
width:250px;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}
 
input,select,textarea{
width:100%;
padding:12px;
margin:8px 0;
border-radius:10px;
border:1px solid #ddd;
}
 
button{
background:#c9a86a;
border:none;
color:white;
padding:14px;
width:100%;
border-radius:30px;
font-size:16px;
}
 
.footer{
background:white;
padding:40px;
margin-top:40px;
}
 
.footer img{
width:120px;
height:120px;
object-fit:cover;
border-radius:50%;
border:4px solid #c9a86a;
}
</style>
</head>
<body>
 
<section class="hero">
<div class="hero-box">
<p>We are honored to welcome you to the Wedding Ceremony of</p>
 
<div class="names">
Raghav <br> & <br> Tara
</div>
 
<p>Son of Mr. Raghunandan Kahar</p>
<p>Daughter of Mr. Kuber Kashyap</p>
 
<br>
